<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2363">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>소이랑 준이 놀이</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fde7f3}
.screen{position:fixed;inset:0;display:none;overflow-y:auto;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.screen.on{display:flex}
#title{background:linear-gradient(#2b2363,#7a4fb0 60%,#ffb3d9)}
h1{color:#fff;font-size:clamp(28px,7vw,56px);text-align:center;margin:0;text-shadow:0 4px 0 #ff5fa8}
.sub{color:#fff;font-size:clamp(18px,4vw,28px)}
.row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.pick{background:#fff;border:none;border-radius:32px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:clamp(22px,5vw,34px);color:#7a3fa0;box-shadow:0 8px 0 #c98be0;cursor:pointer;transition:transform .1s}
.pick:active{transform:translateY(6px);box-shadow:0 2px 0 #c98be0}
.pick img{width:clamp(110px,24vw,180px);height:clamp(110px,24vw,180px);object-fit:contain}
.pick.big img{width:clamp(130px,30vw,220px);height:clamp(130px,30vw,220px)}
.pings{display:flex;gap:6px;justify-content:center}
.pings img{height:clamp(70px,15vw,130px);animation:bob 1.6s ease-in-out infinite}
.pings img:nth-child(2){animation-delay:.3s}.pings img:nth-child(3){animation-delay:.6s}.pings img:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-14px) rotate(-4deg)}}
#field{position:fixed;inset:0;display:none;overflow:hidden}
#field.stars{display:block;background:radial-gradient(circle at 80% 15%,#fff6b0 0 50px,transparent 52px),linear-gradient(#1b1650,#4b2f8f 70%,#7b4fb5)}
#field.cake{display:block;background:linear-gradient(#ffe0ef,#ffd0e6 60%,#f7b4d4)}
.hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:20;pointer-events:none}
.hud .count{background:#fff;border-radius:24px;padding:6px 18px;font-size:clamp(22px,5vw,36px);color:#7a3fa0;box-shadow:0 4px 0 #c98be0}
.home{pointer-events:auto;background:#fff;border:none;border-radius:50%;width:60px;height:60px;font-size:32px;box-shadow:0 4px 0 #c98be0;cursor:pointer}
.star{position:absolute;font-size:clamp(64px,13vw,96px);line-height:1;cursor:pointer;animation:twinkle 1s ease-in-out infinite;filter:drop-shadow(0 0 12px #fff59a);z-index:5}
@keyframes twinkle{50%{transform:scale(1.15) rotate(10deg)}}
.pop{animation:popout .5s forwards!important}
@keyframes popout{to{transform:scale(2.2) rotate(90deg);opacity:0}}
.me{position:absolute;width:clamp(90px,18vw,140px);z-index:6;transition:left .3s,top .3s}
.me img{width:100%;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.rion{position:absolute;width:clamp(90px,18vw,140px);z-index:7;pointer-events:none}
.rion img{width:100%;border-radius:50%;border:6px solid #fff;animation:run .35s ease-in-out infinite}
@keyframes run{50%{transform:translateY(-10px) rotate(6deg)}}
.poop{position:absolute;font-size:clamp(56px,11vw,84px);z-index:8;cursor:pointer;animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
.poop::after{content:"✨";position:absolute;font-size:.4em;right:-.3em;top:-.2em}
@keyframes drop{from{transform:scale(0)}to{transform:scale(1)}}
.bubble{position:absolute;background:#fff;color:#a0408a;border-radius:20px;padding:6px 14px;font-size:clamp(20px,4.5vw,32px);z-index:30;white-space:nowrap;animation:float 1.4s forwards;pointer-events:none}
@keyframes float{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.friend{position:absolute;height:clamp(80px,16vw,130px);z-index:4;pointer-events:none;animation:bob 2s ease-in-out infinite}
/* cake */
.cakewrap{position:absolute;left:0;right:0;top:80px;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.order{display:flex;align-items:center;gap:10px;background:#fff;border-radius:24px;padding:8px 16px;box-shadow:0 4px 0 #e7a3c8}
.order img{height:clamp(70px,14vw,110px)}
.mini{display:flex;flex-direction:column-reverse;align-items:center}
.mini .ly{width:90px;height:26px;border-radius:8px;margin-top:2px;border:2px solid rgba(0,0,0,.1)}
.mini .tp{font-size:34px;line-height:1}
.plate{position:relative;flex:1;width:100%;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding-bottom:6px}
.plate .dish{width:clamp(240px,55vw,380px);height:24px;background:#fff;border-radius:50%;box-shadow:0 6px 0 #d9a0c0}
.plate .ly{width:clamp(180px,42vw,300px);height:clamp(40px,8vw,60px);border-radius:18px;border:3px solid rgba(0,0,0,.08);margin-bottom:-4px;animation:drop .4s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.plate .tp{font-size:clamp(50px,10vw,76px);line-height:1;animation:drop .4s}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:8px 8px 18px}
.cb{width:clamp(76px,17vw,120px);height:clamp(76px,17vw,120px);border-radius:26px;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.18);font-size:clamp(40px,9vw,64px);cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff}
.cb:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.cb.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.12);box-shadow:0 0 0 8px #fff59a}}
#win{background:rgba(43,35,99,.85);z-index:50}
#win img.face{width:clamp(140px,32vw,220px);border-radius:50%;border:8px solid #fff;animation:bob 1s infinite}
.confetti{position:fixed;top:-40px;font-size:30px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,560px)}
.grid4 .pick{font-size:clamp(18px,4.4vw,28px);word-break:keep-all}
.grid4 .pick img{width:clamp(64px,18vw,130px);height:clamp(64px,18vw,130px)}
#field.feed{display:block;background:linear-gradient(#fff3d6,#ffe1b8 62%,#e2b183 62%,#d29d6c)}
#field.bug{display:block;background:linear-gradient(#bfe8ff,#e6f7ff 55%,#9ad58a 55%,#7cc46b)}
.granny img{width:clamp(70px,16vw,110px);border-radius:50%;border:5px solid #fff;display:block;margin:0 auto}
.granny{position:absolute;left:14px;top:84px;font-size:clamp(56px,12vw,88px);line-height:1;z-index:4;text-align:center;animation:bob 2s ease-in-out infinite}
.granny .gl{font-size:clamp(14px,3vw,20px);background:#fff;color:#a0408a;border-radius:12px;padding:2px 8px;margin-top:4px;white-space:nowrap}
.bigrion{position:absolute;left:50%;bottom:6%;width:clamp(130px,30vw,210px);transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1);z-index:6;pointer-events:none}
.bigrion img{width:100%;border-radius:50%;border:7px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15);display:block}
.bigrion.chomp img{animation:chomp .3s}
@keyframes chomp{50%{transform:scale(1.12,.88)}}
.bigrion.shake img{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.food{position:absolute;font-size:clamp(56px,12vw,88px);line-height:1;z-index:7;cursor:pointer;transition:left .45s ease-in,top .45s ease-in,transform .45s;padding:6px}
.food span{display:inline-block;animation:twinkle 1.2s ease-in-out infinite}
.poop.big{font-size:clamp(100px,22vw,160px)}
.sleeper{position:absolute;right:max(16px,4vw);bottom:6%;width:clamp(110px,24vw,170px);z-index:6;pointer-events:none}
.sleeper img{width:100%;border-radius:50%;border:6px solid #fff;display:block}
.sleeper .zz{position:absolute;top:-30px;left:-10px;font-size:36px;animation:bob 1.5s infinite}
.sleeper.jump img{animation:run .2s 4}
.mos{position:absolute;font-size:clamp(66px,15vw,100px);line-height:1;padding:12px;z-index:8;cursor:pointer}
.mos span{display:inline-block;animation:buzz .15s linear infinite}
@keyframes buzz{50%{transform:translateY(-4px) rotate(8deg)}}
#music{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:100;width:60px;height:60px;border-radius:50%;border:none;background:#fff;font-size:30px;box-shadow:0 4px 0 #c98be0;cursor:pointer}
#music.off{opacity:.55}
.pf{position:absolute;z-index:9;cursor:pointer;padding:6px}
.pf img{height:clamp(76px,16vw,110px);display:block}
.pf.dizzy{animation:spin .8s}
@keyframes spin{to{transform:rotate(720deg)}}
.hunter{position:absolute;width:clamp(80px,17vw,110px);z-index:12;pointer-events:none;transition:left .14s ease-out,top .14s ease-out}
.hunter img{width:100%;border-radius:50%;border:5px solid #fff;display:block;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.hunter .hand{position:absolute;right:-26px;top:-34px;font-size:clamp(44px,9vw,64px);transform-origin:20% 90%}
.hunter.slap .hand{animation:slap .3s}
@keyframes slap{0%{transform:rotate(-60deg)}55%{transform:rotate(35deg) scale(1.4)}100%{transform:rotate(0)}}
.sleeper.awake .zz{display:none}
.sleeper.awake img{animation:run .25s infinite}
.sleeper{right:auto!important;bottom:auto!important;z-index:11}
.grid4 .pick.wide{grid-column:1/-1}
.pick .pp{display:flex;gap:8px;align-items:flex-end}
.grid4 .pick .pp img{width:clamp(30px,8vw,62px);height:clamp(70px,20vw,140px);object-fit:contain}
.grid4 .pick .pp{gap:2px}
#field.sea{display:block;background:linear-gradient(#5fd3f3,#2a8fd0 60%,#1b5fa8)}
#field.snow{display:block;background:linear-gradient(#1d3b7a,#5f8fd8 70%,#dff2ff)}
#field.ball{display:block;background:radial-gradient(circle at 50% 30%,#fff3c4,transparent 60%),linear-gradient(#ffc6e4,#e9a6ff)}
.fx{position:absolute;pointer-events:none;z-index:1;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
.fx.down{animation-name:fallfx}
@keyframes fallfx{from{transform:translateY(-10vh)}to{transform:translateY(110vh) rotate(360deg)}}
.pwrap{position:absolute;top:76px;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:3}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding-top:30px}
.fig{position:relative;container-type:size}
.fig > img.body{width:100%;height:100%;display:block}
.fig > img.framed{border-radius:24px;border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15);object-fit:cover}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig .face{position:absolute;left:26%;top:2%;width:48%;border-radius:50%;border:4px solid #fff}
.acc{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;animation:drop .45s cubic-bezier(.3,1.6,.5,1);z-index:5;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.aura{position:absolute;pointer-events:none;animation:twinkle 1s ease-in-out infinite;z-index:6;font-size:8cqw}
.bfly{position:absolute;pointer-events:none;z-index:6;font-size:10cqw;animation:orbit 4s linear infinite}
@keyframes orbit{0%{left:5%;top:30%}25%{left:75%;top:5%}50%{left:85%;top:55%}75%{left:10%;top:70%}100%{left:5%;top:30%}}
.heart{position:absolute;pointer-events:none;z-index:6;font-size:8cqw;animation:hup 2.4s ease-in infinite;opacity:0}
@keyframes hup{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-60cqh) scale(1.2);opacity:0}}
.fig.twirl{animation:twirl 1.2s ease-in-out 2}
@keyframes twirl{50%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(360deg)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 8px 4px;max-width:640px}
.it{width:clamp(56px,14vw,78px);height:clamp(56px,14vw,78px);border-radius:20px;border:4px solid #fff;background:rgba(255,255,255,.85);font-size:clamp(30px,7.5vw,44px);box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.it.on{background:#fff59a;border-color:#ffb3d9}
.it.dot{border-radius:50%}
.magic{margin:4px 0 calc(12px + env(safe-area-inset-bottom,0px));border:none;border-radius:30px;padding:10px 30px;font:inherit;font-size:clamp(24px,6vw,34px);color:#fff;background:linear-gradient(90deg,#ff7ac3,#a77bff);box-shadow:0 6px 0 #8a4fc0;cursor:pointer}
.magic:active{transform:translateY(5px);box-shadow:0 1px 0 #8a4fc0}
.pcards{position:absolute;inset:76px 0 0 0;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;padding:10px;z-index:3}
.pcards .pick img{width:clamp(110px,26vw,170px);height:clamp(130px,30vw,200px);object-fit:contain}
.finale{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:center;z-index:40}
#field.dent{display:block;background:linear-gradient(#e6f7ff,#cdeefe 60%,#b9e3f7)}
.dwrap{position:absolute;top:70px;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3}
.patient{position:relative;height:clamp(90px,18vh,170px)}
.patient img{height:100%;display:block}
.patient.sad img{filter:saturate(.6)}
.patient.happy img{animation:bob .8s ease-in-out infinite}
.mouth{position:relative;width:min(94vw,520px);aspect-ratio:1.6;background:radial-gradient(ellipse at 50% 50%,#7a1030 0 45%,#a8243f 70%);border-radius:48% 48% 50% 50%/40% 40% 60% 60%;border:10px solid #ff8fb0;box-shadow:0 8px 0 rgba(0,0,0,.12);overflow:hidden}
.mouth .tongue{position:absolute;left:25%;right:25%;bottom:12%;height:28%;background:#ff6f8f;border-radius:50% 50% 40% 40%}
.teeth{position:absolute;left:6%;right:6%;display:flex;justify-content:center;gap:2%}
.teeth.top{top:4%}.teeth.bot{bottom:4%}
.tooth{position:relative;width:14%;aspect-ratio:.8;background:#fff;border-radius:30% 30% 45% 45%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6vw,38px);box-shadow:inset 0 -6px 0 #e3e9f0;transition:background .3s}
.teeth.bot .tooth{border-radius:45% 45% 30% 30%;box-shadow:inset 0 6px 0 #e3e9f0}
.tooth.dirty{background:#f3e6a6}
.tooth.cav{background:#f5efe0}
.tooth.cav::after{content:"";position:absolute;width:26%;height:20%;background:#3a2a1a;border-radius:50%;top:18%;left:18%;opacity:.6}
.tooth.clean.shine::before{content:"✨";position:absolute;top:-10%;right:-10%;font-size:.6em;animation:twinkle 1s infinite}
.tooth .g{animation:buzz .3s linear infinite;display:inline-block;position:relative;z-index:2}
.tooltip{position:absolute;font-size:clamp(40px,9vw,60px);z-index:20;pointer-events:none;animation:scrub .5s ease-in-out}
@keyframes scrub{0%,100%{transform:translate(-50%,-50%) rotate(-20deg)}25%{transform:translate(-30%,-50%) rotate(20deg)}50%{transform:translate(-70%,-50%) rotate(-20deg)}75%{transform:translate(-30%,-50%) rotate(20deg)}}
.foam{position:absolute;font-size:22px;z-index:19;pointer-events:none;animation:float 1s forwards}
.tools{display:flex;gap:12px;justify-content:center;padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.tool{width:clamp(76px,19vw,104px);height:clamp(76px,19vw,104px);border-radius:24px;border:5px solid #fff;background:#fff;font-size:clamp(38px,9vw,54px);box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.tool small{font-size:clamp(12px,3vw,16px);color:#7a3fa0;margin-top:2px;font-family:inherit}
.tool.on{background:#fff59a;border-color:#ff9ad5;transform:translateY(-4px)}
.nurse{position:absolute;left:10px;top:80px;width:clamp(64px,15vw,96px);z-index:6;text-align:center;pointer-events:none}
.nurse img{width:100%;border-radius:50%;border:4px solid #fff;display:block}
.nurse .cap{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:30px}
.nurse .lab{font-size:13px;background:#fff;color:#a0408a;border-radius:10px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.cheer{position:absolute;bottom:4%;z-index:30;pointer-events:none;animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
.cheer img{height:clamp(120px,26vh,220px);display:block;animation:bob 1s ease-in-out infinite}
.buddy{position:absolute;left:4px;bottom:4px;width:clamp(80px,20vw,130px);z-index:7;pointer-events:none;animation:bob 1.8s ease-in-out infinite}
#field.croc{display:block;background:linear-gradient(#a8e6ff,#d9f6ff 40%,#9be07f 40%,#6cc35a)}
.hpbar{position:absolute;top:74px;left:50%;transform:translateX(-50%);width:min(70vw,360px);height:22px;background:#fff;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.15);z-index:20;overflow:hidden}
.hpbar i{position:absolute;inset:3px;right:auto;background:linear-gradient(90deg,#2fa84f,#7be05a);border-radius:9px;transition:width .3s}
.hpbar b{position:absolute;left:-30px;top:-6px;font-size:28px}
.hpwrap{position:absolute;top:70px;left:0;right:0;height:30px;z-index:20;pointer-events:none}
.safe{position:absolute;top:108px;right:max(10px,2vw);z-index:15;text-align:center;font-size:clamp(46px,10vw,66px);line-height:1;pointer-events:none}
.safe .n{font-size:clamp(16px,3.6vw,22px);background:#fff;color:#a0408a;border-radius:12px;padding:2px 8px;display:block;margin-top:2px}
.crocm{position:absolute;width:clamp(190px,50vw,320px);z-index:8;pointer-events:none;transition:filter .3s}
.crocm .inner{transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.crocm svg{width:100%;display:block;overflow:visible}
.crocm .jaw{transform-origin:205px 92px;transition:transform .18s}
.crocm.open .jaw{transform:rotate(-30deg)}
.crocm .belly{position:absolute;left:28%;top:48%;width:34%;display:flex;flex-wrap:wrap;justify-content:center;font-size:clamp(14px,3.6vw,22px);line-height:1}
.crocm.stun .inner{animation:shake .15s linear infinite}
.crocm.love{filter:hue-rotate(-90deg) saturate(1.3)}
.crocm.sleep .eyeo{transform:scaleY(.15);transform-origin:228px 52px}
.crocm.baby .inner{transform:scale(.45)!important}
.crocm .st{position:absolute;top:-34px;left:55%;font-size:32px;animation:bob 1s infinite}
.bun{position:absolute;font-size:clamp(46px,10vw,66px);line-height:1;z-index:9;cursor:pointer;padding:6px;transition:left .5s ease-out,top .5s ease-out,transform .5s}
.bun span{display:inline-block;animation:hop .7s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.powers{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:20}
.pw{position:relative;width:clamp(74px,21vw,110px);height:clamp(84px,24vw,124px);border-radius:22px;border:4px solid #fff;background:rgba(255,255,255,.9);box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font:inherit;font-size:clamp(12px,3vw,15px);color:#7a3fa0}
.pw img{height:72%;object-fit:contain}
.pw .cd{position:absolute;inset:0;border-radius:18px;background:rgba(80,60,120,.55);transform-origin:bottom;transform:scaleY(0)}
.pw.cool .cd{animation:cool var(--cd) linear forwards}
@keyframes cool{from{transform:scaleY(1)}to{transform:scaleY(0)}}

<script>
const IMG={elsa2:"IMG.elsa2",elsaface:"IMG.elsaface",soiface:"IMG.soiface",soihead:"IMG.soihead",rainbow:"IMG.rainbow",eunyul:"IMG.eunyul",elsa:"IMG.elsa",cinderella:"IMG.cinderella",sohee:"IMG.soihead",eunface:"IMG.eunface",jun:"IMG.jun",rion:"IMG.rion",pings:["IMG.hachu","IMG.diana","IMG.aurora","IMG.eclipse"]};
const NAME={sohee:"소이",jun:"준이"};
let who="sohee", mode="stars", timers=[], raf=0;
const $=s=>document.querySelector(s);
const field=$("#field");

// ---------- sound ----------
let ac;
function audio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(ac&&ac.state==="suspended")ac.resume(); return ac;}
function tone(f,d=.15,type="sine",vol=.25,when=0,slide){const a=audio();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
const sfx={
  ding(){tone(880,.12,"triangle");tone(1320,.2,"triangle",.2,.08);},
  yay(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.22,i*.12));},
  boo(){tone(300,.25,"square",.12,0,180);},
  poop(){tone(160,.5,"sawtooth",.25,0,60);tone(110,.35,"square",.12,.15,50);tone(700,.12,"sine",.15,.6,1200);},
  bark(){tone(600,.08,"square",.15,0,400);tone(650,.08,"square",.15,.15,420);},
  pop(){tone(400,.1,"sine",.25,0,1600);},
  munch(){tone(320,.07,"square",.15,0,200);tone(280,.07,"square",.15,.13,180);tone(340,.07,"square",.12,.26,220);},
  slap(){tone(1400,.06,"square",.22,0,150);tone(90,.12,"sine",.3,0,60);},
  bigpoop(){tone(200,.9,"sawtooth",.28,0,45);tone(140,.7,"square",.15,.3,40);[900,1100,1300].forEach((f,i)=>tone(f,.12,"sine",.15,1+i*.1));}
};
// ---- farts: several funny kinds ----
let noiseBuf;
function noise(){const a=audio();if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function puff(when,dur,f0,f1,rate,depth,vol,wet){
  const a=audio();if(!a)return;const t=a.currentTime+when;
  const o=a.createOscillator(),lfo=a.createOscillator(),ld=a.createGain(),flt=a.createBiquadFilter(),g=a.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  lfo.type="square";lfo.frequency.setValueAtTime(rate,t);lfo.frequency.linearRampToValueAtTime(rate*0.6,t+dur);ld.gain.value=depth;
  lfo.connect(ld).connect(o.frequency);
  flt.type="lowpass";flt.frequency.value=Math.max(500,f0*6);flt.Q.value=4;
  g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.03);g.gain.setValueAtTime(vol,t+dur*0.7);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(flt).connect(g).connect(a.destination);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);
  if(wet){const n=a.createBufferSource(),bp=a.createBiquadFilter(),ng=a.createGain();n.buffer=noise();bp.type="bandpass";bp.frequency.value=f0*3;bp.Q.value=1.5;
    ng.gain.setValueAtTime(wet,t);ng.gain.exponentialRampToValueAtTime(0.001,t+dur);n.connect(bp).connect(ng).connect(a.destination);n.start(t);n.stop(t+dur+.05);}
}
const FARTS=[
  {w:"뿡!",p:()=>puff(0,.22,130,90,32,40,.5)},
  {w:"뿌우우웅~",p:()=>puff(0,1.1,95,60,26,30,.45)},
  {w:"삐융~♪",p:()=>puff(0,.45,380,760,55,80,.3)},
  {w:"뿌다다다닥!",p:()=>{for(let i=0;i<6;i++)puff(i*.11,.09,120+i*8,100,35,40,.45);}},
  {w:"뿌지직!",p:()=>puff(0,.55,85,70,22,25,.4,.35)},
  {w:"부우웅~ 뽕!",p:()=>{puff(0,.7,70,130,20,25,.45);puff(.8,.12,220,180,40,50,.45);}},
  {w:"뿌뿌뿡~",p:()=>{puff(0,.15,150,120,30,40,.45);puff(.2,.15,120,100,30,40,.45);puff(.42,.4,90,70,26,30,.5);}},
  {w:"뽀옹~?",p:()=>puff(0,.5,160,300,40,30,.35)}
];
let lastFart=-1;
function fart(){let i;do{i=Math.floor(Math.random()*FARTS.length)}while(i===lastFart);lastFart=i;FARTS[i].p();return FARTS[i].w;}

// ---- background music ----
let musicOn=true,musicTimer=0,mStep=0,mNext=0;
try{musicOn=localStorage.getItem("music")!=="off";}catch(e){}
const N=n=>440*Math.pow(2,(n-69)/12);
// cheerful tune: [midi note or 0 for rest] per eighth note, two phrases
const MEL=[72,0,76,79,76,0,72,0, 74,0,77,81,79,0,0,0, 76,0,79,84,79,0,76,0, 74,77,76,74,72,0,0,0,
           79,0,81,79,77,0,76,0, 74,0,76,77,79,0,0,0, 84,0,81,79,77,76,74,0, 72,74,76,74,72,0,0,0];
const BASS=[48,55,53,55, 48,55,50,55, 48,55,53,55, 43,47,48,0];
function musicTick(){
  const a=audio();if(!a)return;
  const eighth=0.24;
  while(mNext<a.currentTime+0.3){
    const t=mNext-a.currentTime;const n=MEL[mStep%MEL.length];
    if(n)tone(N(n),.2,"triangle",.05,Math.max(0,t));
    if(mStep%4===0){const b=BASS[(mStep/4)%BASS.length];if(b)tone(N(b),.35,"sine",.07,Math.max(0,t));}
    if(mStep%2===1)tone(2600,.03,"square",.008,Math.max(0,t));
    mStep++;mNext+=eighth;
  }
}
function startMusic(){const a=audio();if(!a||!musicOn||musicTimer||window.__musicHold)return;mNext=a.currentTime+0.1;musicTimer=setInterval(musicTick,100);}
function stopMusic(){clearInterval(musicTimer);musicTimer=0;}
function setMusicBtn(){const b=document.getElementById("music");if(b){b.textContent=musicOn?"🎵":"🔇";b.classList.toggle("off",!musicOn);}}

function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.95;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}}

// ---------- helpers ----------
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));field.className="";if(id)$(id).classList.add("on");}
function clearGame(){try{stopSong();}catch(e){}window.__musicHold=false;field.onpointerdown=null;timers.forEach(clearTimeout);timers.forEach(clearInterval);timers=[];cancelAnimationFrame(raf);field.innerHTML="";}
function bubble(x,y,txt){const b=document.createElement("div");b.className="bubble";b.textContent=txt;b.style.left=Math.max(4,Math.min(innerWidth-200,x-60))+"px";b.style.top=Math.max(70,y-60)+"px";field.appendChild(b);b.style.left=Math.max(8,Math.min(innerWidth-b.offsetWidth-8,x-b.offsetWidth/2+30))+"px";setTimeout(()=>b.remove(),1500);}
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
function hud(label){const h=el(`<div class="hud"><button class="home">🏠</button><div class="count" id="cnt">${label}</div><div style="width:60px"></div></div>`);field.appendChild(h);h.querySelector(".home").onpointerdown=e=>{e.stopPropagation();goWorld();};}
function confetti(){for(let i=0;i<40;i++){const c=document.createElement("div");c.className="confetti";c.textContent=["⭐","💖","🎉","✨","🌙","🎂"][i%6];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";c.style.animationDelay=Math.random()+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),5000);}}
function win(text){const qm=mode;clearGame();sfx.yay();confetti();$("#winFace").src=IMG[who];$("#winText").textContent=text;show("#win");say(text);const q=QUESTS.find(z=>z.id===qm);if(q)setTimeout(()=>rewardOverlay(completeQuest(qm),`${q.icon} ${q.place}`),900);}

// Rion: chases a target, poops when it arrives
function makeRion(){const r=el(`<div class="rion pdog">${dogInner()}</div>`);field.appendChild(r);return {el:r,x:-150,y:innerHeight*0.6,place(){r.style.left=this.x+"px";r.style.top=this.y+"px";r.firstChild.style.transform=""; }};}
function poopAt(x,y,msg,onClean,big){
  const fw=fart();setTimeout(()=>bubble(x+50,y-40,fw),250);
  const p=el(`<div class="poop${big?" big":""}">💩</div>`);p.style.left=x+"px";p.style.top=y+"px";field.appendChild(p);
  if(msg!=="")bubble(x,y,msg||"뿌직~ 💩");
  p.onpointerdown=e=>{e.stopPropagation();sfx.pop();p.classList.add("pop");bubble(x,y,"뿡! 치웠다 ✨");setTimeout(()=>p.remove(),500);onClean&&onClean();};
  return p;
}

// ---------- STAR GAME ----------
function startStars(){
  mode="stars";clearGame();show(null);field.className="stars";
  const GOAL=10;let got=0;
  hud(`⭐ 0 / ${GOAL}`);
  say(`${NAME[who]}야, 반짝반짝 별을 찾아줘! 리온이가 오기 전에!`);
  // friends floating
  IMG.pings.forEach((src,i)=>{const f=el(`<img class="friend" src="${src}">`);f.style.left=(5+i*24)+"%";f.style.bottom="8px";f.style.animationDelay=i*.4+"s";field.appendChild(f);});
  // player
  const me=el(`<div class="me">${kidHTML(who)}</div>`);field.appendChild(me);
  let mx=innerWidth*0.5-60,my=innerHeight*0.42;me.style.left=mx+"px";me.style.top=my+"px";
  const R=makeRion();R.place();
  let speed=0.9, pooping=false;
  function spawn(){
    if(field.querySelectorAll(".star").length>=3)return;
    const s=el(`<div class="star">⭐</div>`);
    const sz=100;s.style.left=(20+Math.random()*(innerWidth-sz-40))+"px";s.style.top=(90+Math.random()*(innerHeight-sz-230))+"px";
    field.appendChild(s);
    s.onpointerdown=e=>{e.stopPropagation();if(s.classList.contains("pop"))return;s.classList.add("pop");sfx.ding();got++;
      $("#cnt").textContent=`⭐ ${got} / ${GOAL}`;
      const rc=s.getBoundingClientRect();mx=rc.left;my=rc.top;me.style.left=mx+"px";me.style.top=my+"px";
      bubble(rc.left,rc.top,["반짝!","찾았다!","최고!","와~!","잘했어!"][got%5]);
      R.x-=120; // push Rion back
      setTimeout(()=>s.remove(),500);
      if(got>=GOAL){setTimeout(()=>win(`${NAME[who]} 별 ${GOAL}개 다 찾았다! 최고야!`),600);}
    };
  }
  spawn();spawn();
  timers.push(setInterval(spawn,1300));
  field.onpointerdown=e=>{ // missed tap -> Rion a little faster
    if(e.target.closest(".home"))return; sfx.boo(); speed=Math.min(2.2,speed+0.15); bubble(e.clientX,e.clientY,"멍멍! 🐶");
  };
  function loop(){
    if(!pooping){
      const dx=mx-R.x, dy=my-R.y, d=Math.hypot(dx,dy);
      if(d<60){ // caught!
        pooping=true;sfx.bark();
        poopAt(mx+20,my+60,`리온이가 ${NAME[who]} 옆에 뿌직~💩`);
        say("뿌직! 리온이가 똥 쌌다!");
        timers.push(setTimeout(()=>{R.x=Math.random()<.5?-150:innerWidth+30;R.y=innerHeight*Math.random()*.7+80;speed=0.9;pooping=false;},1600));
      }else{R.x+=dx/d*speed;R.y+=dy/d*speed;R.el.firstChild.style.transform=dx>0?"scaleX(-1)":"";}
      R.el.style.left=R.x+"px";R.el.style.top=R.y+"px";
    }
    raf=requestAnimationFrame(loop);
  }
  loop();
}

// ---------- CAKE GAME ----------
const LAYERS=[
  {k:"pink",c:"#ff8cc6",n:"딸기 분홍"},
  {k:"choco",c:"#8b5a3c",n:"초코 갈색"},
  {k:"yellow",c:"#ffe066",n:"바나나 노랑"},
  {k:"purple",c:"#b48cff",n:"포도 보라"},
  {k:"mint",c:"#8ef0c8",n:"민트 초록"}
];
const TOPS=[{k:"🍓",n:"딸기"},{k:"⭐",n:"별"},{k:"🍒",n:"체리"},{k:"🕯️",n:"초"}];
function startCake(){
  mode="cake";clearGame();show(null);field.className="cake";
  const ROUNDS=3;let round=0;
  hud(`🎂 0 / ${ROUNDS}`);
  const wrap=el(`<div class="cakewrap"><div class="order"></div><div class="plate"><div class="dish"></div></div><div class="btns"></div></div>`);
  field.appendChild(wrap);
  const R=makeRion();R.place();
  let recipe,step,busy=false;
  function newCake(){
    const n=Math.min(2+round,4);const pick=[...LAYERS].sort(()=>Math.random()-.5).slice(0,n);
    recipe=[...pick.map(l=>({type:"ly",...l})),{type:"tp",...TOPS[Math.floor(Math.random()*TOPS.length)]}];
    step=0;
    const ping=IMG.pings[round%4];
    wrap.querySelector(".order").innerHTML=`<img src="${ping}"><div style="font-size:clamp(20px,4vw,30px);color:#a0408a">이렇게<br>만들어줘!</div><div class="mini">${recipe.map(r=>r.type==="ly"?`<div class="ly" style="background:${r.c}"></div>`:`<div class="tp">${r.k}</div>`).join("")}</div>`;
    const plate=wrap.querySelector(".plate");plate.innerHTML=`<div class="dish"></div>`;
    renderBtns();
    say(`${NAME[who]}야, 케이크 만들어줘! 맨 아래는 ${recipe[0].n}!`);
  }
  function renderBtns(){
    const b=wrap.querySelector(".btns");b.innerHTML="";
    const cur=recipe[step];
    const items=cur.type==="ly"?LAYERS.map(l=>({type:"ly",...l})):TOPS.map(t=>({type:"tp",...t}));
    items.forEach(it=>{
      const btn=el(`<button class="cb">${it.type==="tp"?it.k:""}</button>`);
      if(it.type==="ly")btn.style.background=it.c;
      btn.onpointerdown=e=>{e.stopPropagation();choose(it,btn);};
      b.appendChild(btn);
    });
    // after 2 mistakes on the same step, show a gentle hint
    if(cur.miss>=2){[...b.children].forEach((btn,i)=>{if(items[i].k===cur.k)btn.classList.add("hint");});}
  }
  function choose(it,btn){
    if(busy)return;const cur=recipe[step];
    if(it.k===cur.k){
      sfx.ding();
      const plate=wrap.querySelector(".plate");
      const piece=it.type==="ly"?el(`<div class="ly" style="background:${it.c}"></div>`):el(`<div class="tp">${it.k}</div>`);
      plate.appendChild(piece);
      const rc=btn.getBoundingClientRect();bubble(rc.left,rc.top,["좋아!","딩동댕!","맞았어!","예쁘다!"][step%4]);
      step++;
      if(step>=recipe.length){
        round++;$("#cnt").textContent=`🎂 ${round} / ${ROUNDS}`;sfx.yay();say("우와! 맛있는 케이크 완성!");
        busy=true;
        timers.push(setTimeout(()=>{busy=false;if(round>=ROUNDS)win(`${NAME[who]} 케이크 ${ROUNDS}개 완성! 최고 파티시에!`);else newCake();},2000));
      }else{renderBtns();const nx=recipe[step];say(nx.type==="ly"?`다음은 ${nx.n}!`:`마지막으로 ${nx.n} 올려줘!`);}
    }else{
      // wrong! Rion chases in and poops
      cur.miss=(cur.miss||0)+1;sfx.boo();busy=true;
      const rc=btn.getBoundingClientRect();
      const tx=rc.left,ty=rc.top-110;
      R.x=tx<innerWidth/2?innerWidth+20:-150;R.y=ty;R.place();sfx.bark();
      say("앗! 리온이가 온다!");
      const t0=performance.now(),sx=R.x;
      (function run(t){const p=Math.min(1,(t-t0)/700);R.x=sx+(tx-sx)*p;R.el.style.left=R.x+"px";R.el.style.top=ty+"px";R.el.firstChild.style.transform=tx>sx?"scaleX(-1)":"";
        if(p<1){raf=requestAnimationFrame(run);}else{
          poopAt(tx<innerWidth/2?tx+110:tx-70,ty+50,"뿌직~ 다시 해보자! 💩");say("뿌직! 다시 해보자!");
          timers.push(setTimeout(()=>{const ex=tx<innerWidth/2?-200:innerWidth+40;R.x=ex;R.place();busy=false;renderBtns();
            field.querySelectorAll(".poop").forEach(p=>p.remove());},1700));
        }})(t0);
    }
  }
  newCake();
}

      f.style.top=(innerHeight*0.18+Math.random()*innerHeight*0.3)+"px";f.style.transform="scale(1)";}));

    timers.push(setTimeout(()=>{
      R.classList.remove("shake");R.style.setProperty("--s",1);[0,1.1].forEach((d,i)=>timers.push(setTimeout(()=>{const w=fart();const r=R.getBoundingClientRect();bubble(r.left+Math.random()*r.width,r.top-20-i*30,w);},d*1000)));
      const rb=R.getBoundingClientRect();let left=0;
      const done=()=>{left--;if(left>0)return;round++;
        if(round>=ROUNDS){win(`${NAME[who]}가 리온이 케이크 다 먹이고 똥도 다 치웠다! 최고야!`);return;}
        eaten=0;busy=false;$("#cnt").textContent=`🍰 0 / ${NEED}`;say("깨끗해졌다! 또 먹여주자!");};
      const spots=[[rb.left-120,rb.bottom-130,true],[rb.right+10,rb.bottom-90],[rb.left-60,rb.top-30],[rb.right-20,rb.top-60]];
      spots.forEach(([x,y,big],i)=>{left++;timers.push(setTimeout(()=>{
        poopAt(Math.max(8,Math.min(innerWidth-110,x)),Math.max(80,Math.min(innerHeight-130,y)),i?"":"뿌지지직~💩",done,big);},i*250));});
      timers.push(setTimeout(()=>say("리온이가 똥 쌌다! 똥을 눌러서 치워줘!"),1400));
    },1300));
  }
  spawn();spawn();timers.push(setInterval(spawn,900));
}

// ---------- MOSQUITO ----------
function startBug(){
  mode="bug";clearGame();show(null);field.className="bug";
  const GOAL=20;let got=0;const fl=[];let won=false;
  const PINGS=[{src:IMG.pings[1],n:"다이아나핑"},{src:IMG.pings[0],n:"하츄핑"},{src:IMG.pings[2],n:"오로라핑"}];
  hud(`🦟 0 / ${GOAL}`);
  // Rion (sleeps, sometimes wakes up to help)
  const R=el(`<div class="sleeper pdog">${dogInner()}<div class="zz">💤</div></div>`);field.appendChild(R);
  const rw=()=>R.offsetWidth||140;
  const home=()=>({x:innerWidth-rw()-16,y:innerHeight*0.94-rw()});
  const rion={x:home().x,y:home().y,state:"sleep",caught:0,until:0,target:null};
  function placeR(){R.style.left=rion.x+"px";R.style.top=rion.y+"px";}
  placeR();
  // the player (swats with a hand)
  const H=el(`<div class="hunter"><img src="${IMG[who]}"><div class="hand">✋</div></div>`);field.appendChild(H);
  const hHome=()=>({x:16,y:innerHeight*0.94-(H.offsetWidth||100)});
  function hTo(x,y){H.style.left=x+"px";H.style.top=y+"px";}
  hTo(hHome().x,hHome().y);let hTimer=0;
  say(`윙윙! 모기가 나타났어! ${NAME[who]}야, 모기만 잡아! 핑은 잡으면 안 돼!`);

  function lvl(){return 1+got/GOAL;} // gets faster as you go
  function retarget(f){f.tx=20+Math.random()*(innerWidth-140);f.ty=80+Math.random()*(innerHeight*0.6);}
  function add(kind,ping){
    const side=Math.random()<.5;
    const f={kind,ping,x:side?-100:innerWidth+10,y:90+Math.random()*innerHeight*0.45,born:performance.now(),ph:Math.random()*6,
      sp:(kind==="mos"?2.4:2.2)+Math.random()*1.4,tx:0,ty:0,pause:0};
    f.el=kind==="mos"?el(`<div class="mos"><span>🦟</span></div>`):el(`<div class="pf"><img src="${ping.src}"></div>`);
    retarget(f);field.appendChild(f.el);fl.push(f);
    f.el.onpointerdown=e=>{e.stopPropagation();kind==="mos"?swat(f):oops(f);};
  }
  function remove(f){const i=fl.indexOf(f);if(i>=0)fl.splice(i,1);}
  function count(by){got++;$("#cnt").textContent=`🦟 ${Math.min(got,GOAL)} / ${GOAL}`;
    if(got>=GOAL&&!won){won=true;setTimeout(()=>win(`${NAME[who]}랑 리온이가 모기 ${GOAL}마리 다 잡았다! 최고야!`),600);}}
  function swat(f){
    if(f.dead)return;f.dead=true;remove(f);
    // player flies over and slaps it
    clearTimeout(hTimer);hTo(f.x-10,f.y-20);H.classList.remove("slap");void H.offsetWidth;H.classList.add("slap");
    setTimeout(()=>{sfx.slap();f.el.innerHTML="<span>💥</span>";bubble(f.x,f.y,["탁!","잡았다!","얍!","찰싹!"][got%4]);setTimeout(()=>f.el.remove(),300);count();},150);
    hTimer=setTimeout(()=>{const h=hHome();hTo(h.x,h.y);},650);
  }
  function oops(f){
    if(f.pause>performance.now())return;
    sfx.boo();f.pause=performance.now()+900;
    f.el.classList.remove("dizzy");void f.el.offsetWidth;f.el.classList.add("dizzy");
    bubble(f.x,f.y,`아야! 나는 ${f.ping.n}야!`);
    say(`아야! 나는 ${f.ping.n}야! 모기만 잡아줘!`);
    const m=fl.find(o=>o.kind==="mos");if(m)setTimeout(()=>bubble(m.x,m.y,"히히~ 못 잡지롱"),500);
  }
  function bite(f){
    f.dead=true;remove(f);f.el.remove();sfx.bark();
    R.classList.remove("jump");void R.offsetWidth;R.classList.add("jump");
    bubble(rion.x,rion.y-40,"앗 가려워! 멍멍!");
    timers.push(setTimeout(()=>{poopAt(rion.x-100,rion.y+30,"깜짝 놀라서 뿌직!💩");say("리온이가 깜짝 놀라서 똥 쌌다!");},600));
  }
  function wakeRion(){
    if(won||rion.state!=="sleep"||!fl.some(f=>f.kind==="mos"))return;
    rion.state="hunt";rion.caught=0;rion.until=performance.now()+4500;R.classList.add("awake");sfx.bark();
    bubble(rion.x,rion.y-40,"멍! 리온이가 도와줄게!");say("리온이가 도와주러 왔어!");
  }
  field.onpointerdown=e=>{if(e.target.closest(".home"))return;tone(500,.08,"sine",.12,0,250);bubble(e.clientX,e.clientY,"휙~");
    clearTimeout(hTimer);hTo(e.clientX-50,e.clientY-50);hTimer=setTimeout(()=>{const h=hHome();hTo(h.x,h.y);},500);};
  function loop(t){
    const L=lvl();
    for(const f of [...fl]){
      if(f.pause>t)continue;
      const age=(t-f.born)/1000;
      if(f.kind==="mos"&&age>8&&rion.state==="sleep"){f.tx=rion.x;f.ty=rion.y;}
      else if(Math.random()<0.02)retarget(f); // sudden zig-zags
      const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1;
      if(d<30){if(f.kind==="mos"&&age>8&&rion.state==="sleep"){bite(f);continue;}retarget(f);}
      const sp=f.sp*(f.kind==="mos"?L:1);
      f.x+=dx/d*sp;f.y+=dy/d*sp+Math.sin(t/140+f.ph)*1.8;
      f.el.style.left=f.x+"px";f.el.style.top=f.y+"px";
      f.el.firstChild.style.transform=dx<0?"scaleX(-1)":"";
    }
    if(rion.state!=="sleep"){
      let goal;
      if(rion.state==="hunt"){
        if(t>rion.until||rion.caught>=2)rion.state="back";
        else{let best=null,bd=1e9;for(const f of fl)if(f.kind==="mos"){const dd=Math.hypot(f.x-rion.x,f.y-rion.y);if(dd<bd){bd=dd;best=f;}}
          if(!best)rion.state="back";else{goal=best;if(bd<60){best.dead=true;remove(best);sfx.slap();sfx.bark();best.el.innerHTML="<span>💥</span>";
            bubble(best.x,best.y,"왕! 잡았다!");setTimeout(()=>best.el.remove(),300);rion.caught++;count();}}}
      }
      if(rion.state==="back")goal=home();
      if(goal){const dx=goal.x-rion.x,dy=goal.y-rion.y,d=Math.hypot(dx,dy)||1,v=7;
        if(rion.state==="back"&&d<8){rion.x=goal.x;rion.y=goal.y;rion.state="sleep";R.classList.remove("awake");}
        else{rion.x+=dx/d*Math.min(v,d);rion.y+=dy/d*Math.min(v,d);R.firstChild.style.transform=dx>0?"scaleX(-1)":"";}}
      placeR();
    }
    raf=requestAnimationFrame(loop);
  }
  function spawn(){
    if(won)return;
    const mos=fl.filter(f=>f.kind==="mos").length;
    if(mos<Math.min(3+Math.floor(got/6),5))add("mos");
    for(const p of PINGS)if(!fl.some(f=>f.ping===p))add("ping",p);
  }
  spawn();spawn();timers.push(setInterval(spawn,1100));
  (function rionHelp(){timers.push(setTimeout(()=>{wakeRion();rionHelp();},7000+Math.random()*5000));})();
  raf=requestAnimationFrame(loop);
}

function startDentist(){
  mode="dentist";clearGame();show(null);field.className="dent";
  const ROUNDS=3;let round=0,tool="brush",left=0,busy=false;
  hud(`🦷 0 / ${ROUNDS}`);
  field.appendChild(el(`<div class="nurse"><div class="cap">👩‍⚕️</div><img src="${IMG.eunyul}"><div class="lab">은율 선생님</div></div>`));
  const w=el(`<div class="dwrap"><div class="patient sad"><img src="${IMG.rainbow}"></div>
    <div class="mouth"><div class="tongue"></div><div class="teeth top"></div><div class="teeth bot"></div></div>

  field.appendChild(w);
  const pat=w.querySelector(".patient"),mouth=w.querySelector(".mouth");
  w.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{tool=b.dataset.t;w.querySelectorAll(".tool").forEach(x=>x.classList.toggle("on",x===b));sfx.pop();
    say(tool==="brush"?"칫솔! 세균을 치카치카!":"물총! 충치 똥을 쓱 씻어내자!");});
  function toolAt(t,emoji){const r=t.getBoundingClientRect();const e=el(`<div class="tooltip">${emoji}</div>`);
    e.style.left=(r.left+r.width/2)+"px";e.style.top=(r.top+r.height/2)+"px";field.appendChild(e);setTimeout(()=>e.remove(),500);
    for(let i=0;i<3;i++){const f=el(`<div class="foam">${emoji==="🪥"?"🫧":"💦"}</div>`);f.style.left=(r.left+Math.random()*r.width)+"px";f.style.top=(r.top+Math.random()*r.height)+"px";field.appendChild(f);setTimeout(()=>f.remove(),1000);}}
  function newRound(){
    busy=false;pat.className="patient sad";
    const top=w.querySelector(".teeth.top"),bot=w.querySelector(".teeth.bot");top.innerHTML="";bot.innerHTML="";
    const teeth=[];for(let i=0;i<12;i++){const t=el(`<div class="tooth"></div>`);(i<6?top:bot).appendChild(t);teeth.push(t);}
    const nG=2+round,nP=2+round;const idx=[...teeth.keys()].sort(()=>Math.random()-.5);
    left=0;
    idx.slice(0,nG).forEach(i=>{const t=teeth[i];t.className="tooth dirty";t.dataset.need="brush";t.dataset.hp=2;t.innerHTML=`<span class="g">🦠</span>`;left++;});
    idx.slice(nG,nG+nP).forEach(i=>{const t=teeth[i];t.className="tooth cav";t.dataset.need="water";t.innerHTML=`<span class="g">💩</span>`;left++;});
    teeth.forEach(t=>t.onpointerdown=e=>{e.stopPropagation();tap(t);});
    const r=pat.getBoundingClientRect();bubble(r.right-20,r.top+10,"아야 아야~ 이가 아파 😢");
    say(round===0?"무지개 괴물이 이가 아프대! 칫솔로 세균을 치카치카, 물총으로 충치 똥을 씻어주자!":"또 아픈 이가 있대! 도와주자!");
  }
  function tap(t){
    if(busy)return;const need=t.dataset.need;
    if(!need){toolAt(t,tool==="brush"?"🪥":"💧");tone(900,.08,"sine",.1);return;}
    if(need!==tool){toolAt(t,tool==="brush"?"🪥":"💧");sfx.boo();const r=t.getBoundingClientRect();
      bubble(r.left,r.top-20,need==="brush"?"세균은 🪥 칫솔로!":"충치 똥은 💧 물총으로!");
      say(need==="brush"?"이건 세균이야! 칫솔로 해줘!":"이건 충치 똥이야! 물총으로 해줘!");return;}
    if(need==="brush"){toolAt(t,"🪥");tone(700,.06,"square",.08,0,900);tone(700,.06,"square",.08,.12,900);
      t.dataset.hp--;if(t.dataset.hp>0){const r=t.getBoundingClientRect();bubble(r.left,r.top-20,"치카치카!");return;}
      const r=t.getBoundingClientRect();bubble(r.left,r.top-20,"으악! 세균 도망~");}
    else{toolAt(t,"💧");const r=t.getBoundingClientRect();const wd=fart();bubble(r.left,r.top-20,wd+" 충치 똥 안녕~");}
    t.className="tooth clean shine";t.innerHTML="";delete t.dataset.need;sfx.ding();left--;
    if(left<=0)done();
  }
  function done(){
    busy=true;round++;$("#cnt").textContent=`🦷 ${round} / ${ROUNDS}`;
    pat.className="patient happy";sfx.yay();
    const r=pat.getBoundingClientRect();bubble(r.right-20,r.top+10,"고마워! 반짝반짝 😁");
    say("와! 이가 반짝반짝! 무지개 괴물이 고맙대!");
    if(round>=ROUNDS){
      // friends come to cheer
      [[IMG.elsa,"6%",true],[IMG.cinderella,"auto",false]].forEach(([src,l,fr],i)=>timers.push(setTimeout(()=>{
        const c=el(`<div class="cheer"><img src="${src}" style="${fr?"border-radius:20px;border:5px solid #fff":""}"></div>`);
        if(i===0)c.style.left="4%";else c.style.right="4%";field.appendChild(c);sfx.ding();},600+i*500)));
      timers.push(setTimeout(()=>say("엘사랑 신데렐라도 축하해주러 왔어! 은율 선생님 최고!"),1600));
      timers.push(setTimeout(()=>win(`${NAME[who]}가 무지개 괴물 이를 다 고쳐줬다! 최고의 치과 선생님!`),5200));
    }else timers.push(setTimeout(newRound,2600));
  }
  newRound();
}

  function tailSwipe(){
    cr.stun=performance.now()+900;C.classList.add("stun");const {x,y}=center();bubble(x,y-70,STAGES[st].fire?"불꽃 꼬리 휘두르기!":"꼬리 휘두르기!");

  }
  function loop(t){
    if(!paused&&!ended){
      if(t>cr.stun){
        C.classList.remove("love","stun","sleep");
        if(st>0&&t>cr.swipeAt){cr.swipeAt=t+8000+Math.random()*4000;tailSwipe();}
        let tgt=null,bd=1e9;const cx=cr.x+crocW()/2;
        for(const b of buns){const d=Math.hypot(b.x-cx,b.y-cr.y)-(b.carrot?2000:0);if(d<bd){bd=d;tgt=b;}}
        if(tgt){const mx=cr.dir>0?cr.x+crocW()*0.85:cr.x+crocW()*0.1,my=cr.y+crocW()*0.2;
          const dx=tgt.x+20-mx,dy=tgt.y+20-my,d=Math.hypot(dx,dy)||1;
          if(Math.abs(dx)>20)cr.dir=dx>0?1:-1;
          const sp=(STAGES[st].sp+(MAXHP-hp)*0.03)*(tgt.carrot?2:1);cr.x+=dx/d*sp;cr.y+=dy/d*sp*0.6;
          cr.y=Math.max(innerHeight*0.25,Math.min(innerHeight*0.62,cr.y));
          const near=d<110;C.classList.toggle("open",near);C.querySelector(".fire").hidden=!(near&&STAGES[st].fire);
          if(d<45){
            tgt.gone=true;buns.splice(buns.indexOf(tgt),1);tgt.el.remove();C.classList.remove("open");C.querySelector(".fire").hidden=true;
            if(tgt.carrot){sfx.munch();hit(1,"carrot");}
            else{belly++;setBelly();sfx.munch();bubble(mx,my-50,tgt.gold?"냠! 황금 토끼다~":"냠! 토끼 맛있다~");if(Math.random()<.4)say("앗! 악어가 토끼를 먹었어! 티니핑, 도와줘!");}
          }
        }else{C.classList.remove("open");C.querySelector(".fire").hidden=true;}
      }else{C.classList.remove("open");C.querySelector(".fire").hidden=true;}
    }
    C.style.left=cr.x+"px";C.style.top=cr.y+"px";C.firstChild.style.scale=cr.dir>0?"1 1":"-1 1";
    raf=requestAnimationFrame(loop);
  }
  for(let i=0;i<4;i++)timers.push(setTimeout(addBun,2300+i*100));
  timers.push(setInterval(addBun,2100));
  timers.push(setInterval(addCarrot,11000));
  startStage(0);
  raf=requestAnimationFrame(loop);
}

// ---------- ENGLISH NUMBERS 1-10 ----------
const EN=["one","two","three","four","five","six","seven","eight","nine","ten"];
const ENU=EN.map(w=>w.toUpperCase());
const KO=["하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉","열"];
function speakSeq(list){try{speechSynthesis.cancel();for(const [t,l] of list){const u=new SpeechSynthesisUtterance(t);u.lang=l==="en"?"en-US":"ko-KR";u.rate=l==="en"?.8:.95;u.pitch=l==="en"?1.15:1.3;speechSynthesis.speak(u);}}catch(e){}}
function sayEn(t){speakSeq([[t,"en"]]);}
function startNum(){
  mode="num";clearGame();show(null);field.className="num";
  hud("🔢 One, Two, Three!");
  const lad=el(`<div class="ladder">${EN.map((_,i)=>`<span>${i+1}</span>`).join("")}</div>`);field.appendChild(lad);
  const w=el(`<div class="nwrap"><div class="scene">${kidHTML("sohee")}${kidHTML("jun")}${dogHTML()}</div><div class="tenframe">${EN.map(()=>"<div></div>").join("")}</div><div class="opts"></div></div>`);
  field.appendChild(w);
  const kids=[...w.querySelectorAll(".kid")];kids[0].style.left="4%";kids[1].style.left="30%";
  // the player stands in front
  if(who==="jun"){kids[1].style.left="4%";kids[0].style.left="30%";}
  const dog=w.querySelector(".dog"),frame=[...w.querySelectorAll(".tenframe div")],opts=w.querySelector(".opts");
  let N=1,caught=0,thrown=0,busy=true;const balls=[];
  const BALLS=["🎾","⚽","🏀","🍪","🦴"];
  function anim(elm,c){elm.classList.remove(c);void elm.offsetWidth;elm.classList.add(c);}
  function setLadder(){[...lad.children].forEach((s,i)=>{s.classList.toggle("now",i===N-1);});}
  function numpop(k){const p=el(`<div class="numpop"><b>${k}</b><span>${ENU[k-1]}</span><small>${KO[k-1]}</small></div>`);field.appendChild(p);setTimeout(()=>p.remove(),1100);}
  function round(){
    caught=0;thrown=0;busy=true;opts.innerHTML="";setLadder();
    frame.forEach((f,i)=>{f.className="";f.innerHTML="";f.style.visibility=i<Math.max(5,N>5?10:5)?"visible":"hidden";});
    const icon=BALLS[(N-1)%BALLS.length];
    speakSeq([[N===1?"리온이가 공을 던진대! 잡아줘!":"리온이가 또 던진다! 하나씩 잡으면서 세어보자!","ko"]]);
    timers.push(setTimeout(()=>throwNext(icon),1800));
  }
  function mouth(){const r=dog.querySelector(".dhead").getBoundingClientRect();return {x:r.left+r.width*0.2,y:r.top+r.height*0.55};}
  function throwNext(icon){
    if(thrown>=N)return;const i=thrown++;
    anim(dog,"throw");tone(620,.07,"square",.1,0,420);
    const kid=kids[i%2],kr=kid.querySelector(".khead").getBoundingClientRect();
    const m=mouth();const b={el:el(`<div class="ball"><span>${icon}</span></div>`),sx:m.x-30,sy:m.y-30,tx:kr.left+kr.width/2-30,ty:kr.top+kr.height/2-30,t0:performance.now(),D:Math.max(1300,2300-N*90),kid,i,icon,done:false};
    field.appendChild(b.el);balls.push(b);
    b.el.onpointerdown=e=>{e.stopPropagation();land(b,true);};
    if(thrown<N)timers.push(setTimeout(()=>throwNext(icon),Math.max(900,1500-N*50)));
  }
  function land(b,caughtIt){
    if(b.done)return;b.done=true;balls.splice(balls.indexOf(b),1);
    const slot=frame[caught];caught++;const k=caught;
    if(caughtIt){anim(b.kid,"catch");sfx.ding();}
    else{anim(b.kid,"bonk");tone(300,.15,"sine",.2,0,150);const dz=el(`<div class="dizzy">💫</div>`);b.kid.appendChild(dz);setTimeout(()=>dz.remove(),1000);
      const kr=b.kid.getBoundingClientRect();bubble(kr.left+20,kr.top,"아야! 콩!");}
    // fly into the ten-frame slot
    const r=slot.getBoundingClientRect(),cur=b.el.getBoundingClientRect();
    b.el.style.transition="left .35s ease-in,top .35s ease-in,transform .35s";b.el.style.left=cur.left+"px";b.el.style.top=cur.top+"px";
    requestAnimationFrame(()=>{b.el.style.left=(r.left+r.width/2-30)+"px";b.el.style.top=(r.top+r.height/2-30)+"px";b.el.style.transform="scale(.6)";});
    setTimeout(()=>{b.el.remove();slot.className="full";slot.innerHTML=`${b.icon}<i>${k}</i>`;},360);
    numpop(k);sayEn(EN[k-1]);tone(440*Math.pow(2,(k-1)/12*2),.18,"triangle",.15);
    if(caught>=N)timers.push(setTimeout(ask,1300));
  }
  function ask(){
    busy=false;
    speakSeq([["몇 개일까?","ko"],["How many?","en"]]);
    const set=new Set([N]);while(set.size<3){const d=N+(Math.floor(Math.random()*5)-2);if(d>=1&&d<=10)set.add(d);}
    const ch=[...set].sort(()=>Math.random()-.5);opts.innerHTML="";
    ch.forEach(k=>{const b=el(`<button class="opt" data-n="${k}"><b>${k}</b><span>${ENU[k-1]}</span></button>`);b.onclick=()=>choose(k,b);opts.appendChild(b);});
  }
  function countAlong(cb,step=650){
    busy=true;let i=0;
    (function next(){if(i>=N){frame.forEach(f=>f.classList.remove("glow"));cb&&cb();return;}
      frame.forEach(f=>f.classList.remove("glow"));frame[i].classList.add("glow");sayEn(EN[i]);tone(440*Math.pow(2,i/6),.15,"triangle",.12);i++;timers.push(setTimeout(next,step));})();
  }
  function choose(k,btn){
    if(busy)return;
    if(k===N){
      busy=true;sfx.yay();kids.forEach(kd=>anim(kd,"kcheer"));anim(dog,"happy");lad.children[N-1].classList.add("done");
      opts.querySelectorAll(".opt").forEach(o=>{if(o!==btn)o.style.visibility="hidden";});
      speakSeq([[`${EN[N-1]}!`,"en"],[`정답! ${KO[N-1]}! ${N}개!`,"ko"]]);
      for(let i=0;i<6;i++){const c=el(`<div class="confetti">${["⭐","💖","✨"][i%3]}</div>`);c.style.left=Math.random()*100+"vw";c.style.animationDuration="2s";document.body.appendChild(c);setTimeout(()=>c.remove(),2500);}
      timers.push(setTimeout(()=>countAlong(()=>{
        if(N>=10)finale();else{N++;timers.push(setTimeout(round,700));}
      },N>6?420:550),2200));
    }else{
      busy=true;btn.classList.add("no");sayEn(EN[k-1]);
      timers.push(setTimeout(()=>{const r=dog.getBoundingClientRect();anim(dog,"throw");poopAt(r.left+r.width*0.75,r.bottom-60,`히히! ${k}개가 아니야~`);
        speakSeq([["앗! 리온이가 똥 쌌다! 같이 세어볼까?","ko"]]);},700));
      timers.push(setTimeout(()=>countAlong(()=>{busy=false;opts.querySelector(`[data-n="${N}"]`).classList.add("hint");speakSeq([["How many?","en"]]);}),3200));
    }

// ---------- seeded map ----------
let W=null;
function buildWorld(){
  const {MW,MH}=RPG;let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const g=[...Array(MH)].map(()=>Array(MW).fill(0)); // 0 grass 1 path 2 water 3 swamp 4 tree 6 bld 7 npc 8 hill
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(((x-7.5)/5.6)**2+((y-20.5)/4)**2<1)g[y][x]=2;
    if(((x-30.5)/5)**2+((y-23)/3.6)**2<1)g[y][x]=3;
  }
  const carve=(x0,y0,x1,y1)=>{let x=x0,y=y0;const put=(a,b)=>{for(const[dx,dy]of[[0,0]]){const X=a+dx,Y=b+dy;if(X>0&&Y>0&&X<MW-1&&Y<MH-1&&g[Y][X]<2)g[Y][X]=1;}};
    while(x!==x1){put(x,y);x+=Math.sign(x1-x);}while(y!==y1){put(x,y);y+=Math.sign(y1-y);}put(x,y);};
  for(let y=12;y<=15;y++)for(let x=16;x<=20;x++)g[y][x]=1; // plaza
  const P={x:18,y:13};
  [...QUESTS,CASTLE_NPC].forEach(q=>carve(P.x,P.y,q.tx+(q.id==="princess"?1:0),q.ty+1));
  for(const b of BLD)for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)g[y][x]=6;
  const near=(x,y)=>[...QUESTS,CASTLE_NPC].some(q=>Math.hypot(q.tx-x,q.ty-y)<2.2)||Math.hypot(x-7,y-5)<3||(x>=15&&x<=21&&y>=11&&y<=16);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(g[y][x]!==0)continue;
    const edge=x<1||y<1||x>=MW-1||y>=MH-1,forest=x>=25&&y<=12&&y>=1;
    if(edge||(!near(x,y)&&rnd()<(forest?.42:.07)))g[y][x]=4;
  }
  for(const q of [...QUESTS,CASTLE_NPC])g[q.ty][q.tx]=7;
  const flowers=[];for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(g[y][x]===0&&rnd()<.09)flowers.push({x,y,c:["#ff8fc8","#ffe066","#ffffff","#b58cff","#ff7a7a"][Math.floor(rnd()*5)],ox:rnd(),oy:rnd()});
  const trees=[];for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(g[y][x]===4)trees.push({x,y,v:rnd(),s:.85+rnd()*.35});
  W={g,flowers,trees,bg:null,treeSpr:[],bldSpr:{},seed:rnd};
  renderGround();prerenderSprites();
}
function renderGround(){
  const {T,MW,MH}=RPG;const c=document.createElement("canvas");c.width=MW*T;c.height=MH*T;const x=c.getContext("2d");
  let seed=99;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  x.fillStyle="#8fd16a";x.fillRect(0,0,c.width,c.height);
  for(let i=0;i<900;i++){x.fillStyle=r()<.5?"rgba(120,190,80,.35)":"rgba(170,230,120,.35)";x.beginPath();x.ellipse(r()*c.width,r()*c.height,20+r()*50,10+r()*26,0,0,7);x.fill();}
  x.strokeStyle="rgba(70,140,50,.45)";x.lineWidth=2;for(let i=0;i<2600;i++){const a=r()*c.width,b=r()*c.height;x.beginPath();x.moveTo(a,b);x.lineTo(a+(r()-.5)*4,b-5-r()*5);x.stroke();}
  // star hill
  const hx=7.5*T,hy=5.5*T;const hg=x.createRadialGradient(hx,hy-20,10,hx,hy,3.2*T);hg.addColorStop(0,"#b9ec8e");hg.addColorStop(1,"rgba(143,209,106,0)");x.fillStyle=hg;x.beginPath();x.ellipse(hx,hy,3.3*T,2.4*T,0,0,7);x.fill();
  for(let y=0;y<MH;y++)for(let X=0;X<MW;X++){
    const t=W.g[y][X],px=X*T,py=y*T;
    if(t===1){x.fillStyle="#ecd09a";x.beginPath();x.roundRect(px-3,py-3,T+6,T+6,14);x.fill();}
  }
  for(let y=0;y<MH;y++)for(let X=0;X<MW;X++){if(W.g[y][X]!==1)continue;const px=X*T,py=y*T;x.fillStyle="rgba(190,150,90,.5)";for(let k=0;k<3;k++){x.beginPath();x.ellipse(px+r()*T,py+r()*T,2+r()*3,1.5+r()*2,0,0,7);x.fill();}}
  // water + swamp shapes (smooth)
  const blob=(cx,cy,rx,ry,c1,c2,edge)=>{x.fillStyle=edge;x.beginPath();x.ellipse(cx,cy,rx+10,ry+10,0,0,7);x.fill();const gg=x.createRadialGradient(cx,cy-ry*.3,10,cx,cy,Math.max(rx,ry));gg.addColorStop(0,c1);gg.addColorStop(1,c2);x.fillStyle=gg;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill();};
  blob(8*T,21*T,5.6*T,4*T,"#8fe0ff","#3aa6e0","#f3e2b0");
  blob(31*T,23.5*T,5*T,3.6*T,"#7fae6a","#4c7a46","#6b8f4f");
  for(let i=0;i<14;i++){const a=r()*6.28,d=r();const px=31*T+Math.cos(a)*d*4*T,py=23.5*T+Math.sin(a)*d*2.8*T;x.fillStyle="#3f8f3a";x.beginPath();x.arc(px,py,9+r()*6,.3,6.0);x.lineTo(px,py);x.fill();if(r()<.4){x.fillStyle="#ff9ad5";x.beginPath();x.arc(px+3,py-3,4,0,7);x.fill();}}
  for(const f of W.flowers){const px=(f.x+f.ox)*T,py=(f.y+f.oy)*T;x.fillStyle=f.c;for(let k=0;k<5;k++){x.beginPath();x.arc(px+Math.cos(k*1.26)*4,py+Math.sin(k*1.26)*4,3,0,7);x.fill();}x.fillStyle="#ffd34d";x.beginPath();x.arc(px,py,2.4,0,7);x.fill();}
  W.bg=c;
}
function prerenderSprites(){
  const {T}=RPG;
  for(let v=0;v<3;v++){const c=document.createElement("canvas");c.width=T*1.6;c.height=T*2.1;const x=c.getContext("2d");const cx=c.width/2,by=c.height-6;
    x.fillStyle="rgba(0,0,0,.18)";x.beginPath();x.ellipse(cx,by,T*.5,T*.16,0,0,7);x.fill();

    const blobs=[[0,-1.25,.62],[-.34,-1.0,.46],[.34,-1.0,.46],[0,-.85,.5]];
    for(const[ox,oy,rr]of blobs){x.fillStyle=cols[0];x.beginPath();x.arc(cx+ox*T,by+oy*T,rr*T+3,0,7);x.fill();}
    for(const[ox,oy,rr]of blobs){x.fillStyle=cols[1];x.beginPath();x.arc(cx+ox*T,by+oy*T,rr*T,0,7);x.fill();}
    x.fillStyle=cols[2];x.beginPath();x.arc(cx-.18*T,by-1.42*T,.22*T,0,7);x.fill();
    if(v===1){x.fillStyle="#ff6b6b";for(const[a,b]of[[-.3,-1.1],[.25,-1.3],[.1,-.9]]){x.beginPath();x.arc(cx+a*T,by+b*T,4,0,7);x.fill();}}
    W.treeSpr.push(c);}
  for(const b of BLD){const c=document.createElement("canvas");const pw=b.w*T,ph=(b.h+1.6)*T;c.width=pw+20;c.height=ph+10;const x=c.getContext("2d");const ox=10,base=c.height-6;
    x.fillStyle="rgba(0,0,0,.2)";x.beginPath();x.ellipse(ox+pw/2,base,pw*.55,14,0,0,7);x.fill();
    if(b.castle){
      x.fillStyle="#f3e8ff";x.fillRect(ox+T*.6,base-T*3.2,pw-T*1.2,T*3.2);
      for(const tx of[0,pw-T*1.4]){x.fillStyle="#e6d6ff";x.fillRect(ox+tx,base-T*4.4,T*1.4,T*4.4);x.fillStyle="#b58cff";x.beginPath();x.moveTo(ox+tx-6,base-T*4.4);x.lineTo(ox+tx+T*.7,base-T*5.5);x.lineTo(ox+tx+T*1.4+6,base-T*4.4);x.fill();}
      x.fillStyle="#d9c2ff";x.fillRect(ox+pw/2-T,base-T*4.6,T*2,T*1.6);x.fillStyle="#ff8fc8";x.beginPath();x.moveTo(ox+pw/2-T-8,base-T*4.6);x.lineTo(ox+pw/2,base-T*6);x.lineTo(ox+pw/2+T+8,base-T*4.6);x.fill();
      x.fillStyle="#ffd34d";x.beginPath();x.arc(ox+pw/2,base-T*6.05,7,0,7);x.fill();
      for(let i=0;i<6;i++){x.fillStyle="#e6d6ff";x.fillRect(ox+T*.6+i*(pw-T*1.2)/6+4,base-T*3.45,T*.4,T*.3);}
      x.fillStyle="#7a4fc0";x.beginPath();x.roundRect(ox+pw/2-T*.55,base-T*1.5,T*1.1,T*1.5,[T*.55,T*.55,0,0]);x.fill();
      x.fillStyle="#8fd3ff";for(const wx of[T*1.5,pw-T*2.1]){x.beginPath();x.roundRect(ox+wx,base-T*2.4,T*.6,T*.8,[T*.3,T*.3,4,4]);x.fill();}
      x.font=`${T*.6}px serif`;x.textAlign="center";x.fillText("🚩",ox+T*.9,base-T*5.4);x.fillText("🚩",ox+pw-T*.7,base-T*5.4);
    }else{

      x.fillStyle=b.roof2;x.beginPath();x.moveTo(ox-6,wallTop+6);x.lineTo(ox+pw/2,wallTop-T*1.25);x.lineTo(ox+pw+6,wallTop+6);x.closePath();x.fill();
      x.fillStyle=b.roof;x.beginPath();x.moveTo(ox+2,wallTop);x.lineTo(ox+pw/2,wallTop-T*1.15);x.lineTo(ox+pw-2,wallTop);x.closePath();x.fill();
      x.strokeStyle="rgba(255,255,255,.4)";x.lineWidth=2;for(let i=1;i<4;i++){x.beginPath();x.moveTo(ox+pw/2-i*pw/9,wallTop-T*1.15+i*T*.28);x.lineTo(ox+pw/2+i*pw/9,wallTop-T*1.15+i*T*.28);x.stroke();}
      x.fillStyle="#9a6a45";x.beginPath();x.roundRect(ox+pw/2-T*.38,base-T*1.05,T*.76,T*1.05,[T*.38,T*.38,0,0]);x.fill();x.fillStyle="#ffd34d";x.beginPath();x.arc(ox+pw/2+T*.2,base-T*.5,3,0,7);x.fill();

function outlineFill(x,path,fill,stroke="#4a2f4f",lw=2.2){x.fillStyle=fill;path();x.fill();x.lineWidth=lw;x.strokeStyle=stroke;x.stroke();}
function headPhoto(x,img,r,dir,hair){
  x.save();x.beginPath();x.arc(0,0,r+2.5,0,7);x.fillStyle="#4a2f4f";x.fill();
  x.beginPath();x.arc(0,0,r+1,0,7);x.fillStyle="#fff";x.fill();
  x.beginPath();x.arc(0,0,r,0,7);x.clip();
  if(img&&img.complete&&img.naturalWidth){const s=r*2.25;x.drawImage(img,-s/2+(dir==="left"?-2:dir==="right"?2:0),-s/2+1,s,s);}
  x.restore();
}
function drawKid(x,k,px,py,dir,ph,moving,sc=1){
  x.save();x.translate(px,py);x.scale(sc,sc);
  const soi=k==="sohee";const sw=moving?Math.sin(ph)*5:0;const bob=moving?-Math.abs(Math.sin(ph))*2.5:Math.sin(ph*.35)*.8;
  x.fillStyle="rgba(0,0,0,.22)";x.beginPath();x.ellipse(0,0,15,5,0,0,7);x.fill();
  x.translate(0,bob);
  // cape (behind)
  if(dir!=="up"){outlineFill(x,()=>{x.beginPath();x.moveTo(-11,-34);x.quadraticCurveTo(-18,-14,-14+sw*.3,-6);x.lineTo(14-sw*.3,-6);x.quadraticCurveTo(18,-14,11,-34);x.closePath();},soi?"#8a5cd6":"#d94a5a");}

// ---------- pathfinding ----------
function walkable(x,y){if(!W||x<0||y<0||x>=RPG.MW||y>=RPG.MH)return false;const t=W.g[y][x];return t===0||t===1;}
function findPath(sx,sy,tx,ty){
  const {MW,MH}=RPG;const key=(x,y)=>y*MW+x;const open=[[sx,sy]],came=new Map(),gS=new Map([[key(sx,sy),0]]);const h=(x,y)=>Math.abs(x-tx)+Math.abs(y-ty);const f=new Map([[key(sx,sy),h(sx,sy)]]);
  let it=0;while(open.length&&it++<4000){open.sort((a,b)=>f.get(key(...a))-f.get(key(...b)));const [cx,cy]=open.shift();
    if(cx===tx&&cy===ty){const p=[[cx,cy]];let k=key(cx,cy);while(came.has(k)){const pr=came.get(k);p.unshift(pr);k=key(...pr);}return p;}
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(!walkable(nx,ny))continue;const ng=gS.get(key(cx,cy))+1;const nk=key(nx,ny);
      if(ng<(gS.has(nk)?gS.get(nk):1e9)){came.set(nk,[cx,cy]);gS.set(nk,ng);f.set(nk,ng+h(nx,ny));if(!open.some(o=>o[0]===nx&&o[1]===ny))open.push([nx,ny]);}}}
  return null;
}
function nearestWalkable(tx,ty,from){let best=null,bd=1e9;for(let r=0;r<=4;r++)for(let y=ty-r;y<=ty+r;y++)for(let x=tx-r;x<=tx+r;x++){if(!walkable(x,y))continue;const d=Math.hypot(x-tx,y-ty)*10+Math.hypot(x-from.x,y-from.y)*.1;if(d<bd){bd=d;best={x,y};}}return best;}

let miniBg=null;

// ---------- input ----------
function worldTap(e){
  if(ST.dlg){advanceDlg();return;}
  const {T}=RPG;const Z=zoom();const wx=e.clientX/Z+ST.cam.x,wy=e.clientY/Z+ST.cam.y;
  for(let i=0;i<4;i++)ST.sparks.push({x:wx+(Math.random()-.5)*20,y:wy+(Math.random()-.5)*20,l:1});
  let tx=Math.floor(wx/T),ty=Math.floor(wy/T);
  // tapping near an NPC (or its building) -> go talk
  let q=[...QUESTS,CASTLE_NPC].find(q=>Math.hypot(q.tx+.5-wx/T,q.ty+.3-wy/T)<1.3);
  if(!q){const b=BLD.find(b=>tx>=b.x&&tx<b.x+b.w&&ty>=b.y-2&&ty<b.y+b.h);if(b)q=b.q==="castle"?CASTLE_NPC:QUESTS.find(z=>z.id===b.q);}

  const p=findPath(hx,hy,tx,ty);if(!p)return;p.shift();ST.path=p;ST.target={x:tx,y:ty};sfx.pop();

function buildTrack(){
  const segs=[];let lastY=0;const ease=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5);
  const road=(e,h,l,c,hill)=>{const sY=lastY,eY=sY+hill*RC.SEG,tot=e+h+l;let n=0;
    const push=cv=>{n++;const y=ease(sY,eY,n/tot);segs.push({i:segs.length,curve:cv,y1:lastY,y2:y,spr:[]});lastY=y;};
    for(let i=0;i<e;i++)push(ease(0,c,i/e));for(let i=0;i<h;i++)push(c);for(let i=0;i<l;i++)push(ease(c,0,i/l));};
  road(30,30,30,0,0);road(25,40,25,2.5,10);road(25,25,25,0,-14);road(25,50,25,-4.5,0);road(20,20,20,3.5,8);road(20,20,20,-3.5,-8);
  road(30,50,30,0,18);road(25,40,25,5,-12);road(25,30,25,-2.5,6);road(25,40,25,3,0);road(25,30,25,-4,-6);
  road(30,40,30,0,-lastY/RC.SEG);
  const N=segs.length;
  segs.forEach((s,i)=>{s.boost=false;s.box=null;s.fart=null;s.coins=null;s.spill=null;
    if(i%10===0)s.spr.push({k:i%20?"lamp":"tree",o:-1.35});if(i%10===5)s.spr.push({k:i%20===5?"balloon":"lamp",o:1.35});
    if(i%50===22)s.spr.push({k:"crowd",o:-2.2});if(i%50===47)s.spr.push({k:"crowd",o:2.2});
    if(i%130===70)s.spr.push({k:"sign",o:i%260?-2:2});
    if(i>50&&i%80===0)s.box=[-.6,-.2,.2,.6].map(o=>({o,t:0}));
    if(i>40&&i%110===60)s.boost=(i%220===60)?-.45:.45;
    if(i>20&&i%37===0&&!s.box){const o=[-.5,0,.5][i%3];for(let k=0;k<5;k++){const t=segs[(i+k*2)%N];(t.coins=t.coins||[]).push({o,t:0});}}
    if(i>90&&i%150===100)s.spill={o:i%300===100?-.3:.35};
  });
  segs[2].spr.push({k:"arch",o:0});
  return segs;
}

function buildTrack3D(){
  const S=1.9,HY=1.3;
  const P=[[0,0,0],[50,0,0],[95,3,-15],[135,8,10],[140,10,55],[110,6,85],[70,2,70],[45,4,100],[60,9,140],[20,12,165],[-30,8,150],[-60,3,110],[-55,0,60],[-30,0,20]]
    .map(([x,y,z])=>new THREE.Vector3(x*S,y*HY,z*S));
  const curve=new THREE.CatmullRomCurve3(P,true,"centripetal");
  const L=curve.getLength(),N=Math.round(L);const up=new THREE.Vector3(0,1,0);

  const segs=[];for(let i=0;i<N;i++){const d=tans[i+1].dot(rights[i]);segs.push({i,curve:Math.max(-4.2,Math.min(4.2,d*95)),y1:pts[i].y*200,y2:pts[i+1].y*200,spr:[]});}
  segs.forEach((s,i)=>{s.boost=false;s.box=null;s.fart=null;s.coins=null;s.spill=null;
    if(i%12===0)s.spr.push({k:i%24?"lamp":"tree",o:-1.4});if(i%12===6)s.spr.push({k:i%24===6?"balloon":"lamp",o:1.4});
    if(i%9===3)s.spr.push({k:"tree",o:(i%18===3?-1:1)*(3.2+((i*7)%10)/4)});
    if(i%60===25)s.spr.push({k:"crowd",o:-2.3});if(i%60===55)s.spr.push({k:"crowd",o:2.3});
    if(i%150===80)s.spr.push({k:"sign",o:i%300?-2.1:2.1});
    if(i>50&&i%85===0)s.box=[-.6,-.2,.2,.6].map(o=>({o,t:0}));
    if(i>40&&i%115===60)s.boost=(i%230===60)?-.45:.45;
    if(i>20&&i%37===0&&!s.box){const o=[-.5,0,.5][i%3];for(let k=0;k<5;k++){const t=segs[(i+k*2)%N]||null;if(t)(t.coins=t.coins||[]).push({o,t:0});}}
    if(i>90&&i%160===100)s.spill={o:i%320===100?-.3:.35};});
  // second pass for coins that wrapped
  segs.geo={curve,pts,tans,rights,N};
  return segs;
}

    marks.forEach(mk=>{const ms=(mk.at-a.currentTime)*1000;timers.push(setTimeout(()=>{if(mk.si===0)showLine(mk.li);const sp=kl.querySelectorAll("span")[mk.si];if(sp)sp.classList.add("on");
      const n=el(`<i>${["♪","♫","❄","♬"][mk.si%4]}</i>`);n.style.left=(30+Math.random()*50)+"%";w.querySelector(".notes").appendChild(n);setTimeout(()=>n.remove(),1600);},Math.max(0,ms)));});
    timers.push(setTimeout(()=>{singing=false;w.classList.remove("singing");kara.hidden=true;btns.hidden=false;confetti();sfx.yay();
      speakSeq([["와아! 다 같이 잘 불렀어! 이제 내가 동화책을 읽어 줄게. 동화책 버튼을 눌러 봐!","ko"]]);},(end-a.currentTime)*1000+400));
  }
  btns.querySelector('[data-a=sing]').onclick=()=>sing();
  btns.querySelector('[data-a=book]').onclick=()=>{stopSong();singing=false;openStorybook();};
  kara.hidden=true;btns.hidden=true;timers.push(setTimeout(()=>{if(!singing)btns.hidden=false;},9000));
}

function openStorybook(){
  const w=field.querySelector(".elsaw");if(w)w.classList.add("reading");
  const ov=el(`<div class="book"><div class="bk-reader"><img src="${IMG.elsaface}"><span>엘사 언니가 읽어줘요</span></div>
    <div class="bk-open"><div class="bk-page"></div></div>
    <div class="bk-text"></div>
    <div class="bk-nav"><button class="pick" data-a="prev">◀</button><span class="bk-no"></span><button class="pick" data-a="play">⏸</button><button class="pick" data-a="next">▶</button></div></div>`);
  field.appendChild(ov);
  // soft music-box background of the same song
  let bgmT=null;const loopBgm=()=>{const s=playSong({musicBox:true,bpm:84});bgmT=setTimeout(loopBgm,(s.end-audio().currentTime)*1000);timers.push(bgmT);};
  stopSong();loopBgm();
  const pageEl=ov.querySelector(".bk-page"),textEl=ov.querySelector(".bk-text"),noEl=ov.querySelector(".bk-no");
  let pi=0,auto=true,token=0;
  const DOGSRC=dogPNG(),KIDS={sohee:kidPNG("sohee"),jun:kidPNG("jun")};
  function itemHTML(it){
    let inner="";if(it.e)inner=`<span class="bk-emo">${it.e}</span>`;else if(it.ping)inner=`<img src="${rpgImg(it.ping).src}">`;else if(it.kid)inner=`<img src="${KIDS[it.kid]}">`;else if(it.dog)inner=`<img src="${DOGSRC}">`;else if(it.face)inner=`<img class="round" src="${IMG[it.face]}">`;else if(it.img)inner=`<img class="soft" src="${IMG[it.img]}">`;
    const W2=Math.min(60,it.w*1.45),X2=Math.max(0,Math.min(100-W2,it.x*.9)),Y2=Math.min(78,it.y*1.05+4);return `<button class="bk-it ${it.cls||""}" style="left:${X2}%;top:${Y2}%;width:${W2}%;${it.e?`font-size:${W2*.6}cqw`:""}">${inner}</button>`;}
  function show(i,dir){
    pi=Math.max(0,Math.min(STORY.length-1,i));const pg=STORY[pi];token++;const my=token;
    pageEl.className="bk-page bg-"+pg.bg+(dir?" flip"+(dir>0?"N":"P"):"");
    pageEl.innerHTML=(pg.title?`<div class="bk-title">${pg.title}</div>`:"")+pg.it.map(itemHTML).join("");
    pageEl.querySelectorAll(".bk-it").forEach((b,k)=>{const it=pg.it[k];b.onclick=e=>{e.stopPropagation();b.classList.remove("wig");void b.offsetWidth;b.classList.add("wig");
      if(it.fart){fart();}else if(it.dog)sfx.bark();else tone(880+k*120,.15,"triangle",.12);if(it.say){const r=b.getBoundingClientRect();bubble(r.left+r.width/2-30,r.top+20,it.say);}};});
    noEl.textContent=`${pi+1} / ${STORY.length}`;
    // sentence-by-sentence highlight while Elsa reads
    const sents=pg.text.match(/[^.!?]+[.!?]?['’]?/g).map(s=>s.trim()).filter(Boolean);
    textEl.innerHTML=sents.map((s,k)=>`<span data-k="${k}">${s} </span>`).join("");
    tone(600,.08,"sine",.06);
    if(!auto)return;
    let k=0;const next=()=>{if(my!==token)return;if(k>=sents.length){timers.push(setTimeout(()=>{if(my===token&&auto){if(pi<STORY.length-1)show(pi+1,1);else theEnd();}},1600));return;}
      textEl.querySelectorAll("span").forEach((s,j)=>s.classList.toggle("on",j===k));
      const txt=sents[k];k++;let done=false;const fin=()=>{if(done)return;done=true;timers.push(setTimeout(next,350));};
      try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/['’]/g,""));u.lang="ko-KR";u.rate=.92;u.pitch=1.25;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);}catch(e){}
      timers.push(setTimeout(fin,Math.max(2200,txt.length*190)));};
    timers.push(setTimeout(next,dir?700:400));
  }
  function theEnd(){auto=false;ov.querySelector('[data-a=play]').textContent="▶";
    const end=el(`<div class="bk-end"><div>🎉 동화 끝! 🎉</div><button class="pick" data-a="again">📖 처음부터</button><button class="pick" data-a="sing2">🎤 노래 또 듣기</button></div>`);ov.appendChild(end);confetti();sfx.yay();
    say("재미있었지? 엘사 언니가 소이랑 준이 정말 사랑해!");
    end.querySelector('[data-a=again]').onclick=()=>{end.remove();auto=true;ov.querySelector('[data-a=play]').textContent="⏸";show(0);};
    end.querySelector('[data-a=sing2]').onclick=()=>{clearTimeout(bgmT);stopSong();ov.remove();if(w)w.classList.remove("reading");const b=field.querySelector('.elsabtns [data-a=sing]');if(b)b.click();};
    const q=QUESTS.find(z=>z.id==="elsa");if(q)setTimeout(()=>rewardOverlay(completeQuest("elsa"),`${q.icon} ${q.place}`),1200);}
  ov.querySelector('[data-a=prev]').onclick=()=>{try{speechSynthesis.cancel();}catch(e){}show(pi-1,-1);};
  ov.querySelector('[data-a=next]').onclick=()=>{try{speechSynthesis.cancel();}catch(e){}if(pi<STORY.length-1)show(pi+1,1);else theEnd();};
  ov.querySelector('[data-a=play]').onclick=e=>{auto=!auto;e.target.textContent=auto?"⏸":"▶";if(auto)show(pi);else{token++;try{speechSynthesis.cancel();}catch(_){}}};
  show(0);
}
